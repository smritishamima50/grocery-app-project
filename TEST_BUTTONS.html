<!DOCTYPE html>
<html>
<head>
    <title>Test Buttons - Orders Management</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .test-section { margin: 20px 0; padding: 15px; background: #2a2a2a; border-left: 3px solid #0f0; }
        button { padding: 10px 20px; margin: 5px; background: #0f0; color: #000; border: none; cursor: pointer; }
        button:hover { background: #4f4; }
        .success { color: #4f4; }
        .error { color: #f44; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 Test Orders Management Buttons</h1>
    
    <div class="test-section">
        <h2>Test 1: Check JavaScript Functions</h2>
        <button onclick="testFunctions()">Test Functions</button>
        <div id="test-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Test API Endpoint</h2>
        <input type="number" id="testOrderId" placeholder="Order ID" value="1" style="padding: 10px; margin: 5px;">
        <button onclick="testUpdateStatus()">Test Status Update</button>
        <button onclick="testAssignDriver()">Test Driver Assignment</button>
        <div id="api-results"></div>
    </div>
    
    <div class="test-section">
        <h2>Test 3: Test Export</h2>
        <button onclick="testExport()">Test Export</button>
        <div id="export-results"></div>
    </div>
    
    <script>
        function testFunctions() {
            const results = document.getElementById('test-results');
            let html = '<pre>';
            
            // Test if functions exist
            if (typeof updateOrderStatus === 'function') {
                html += '<div class="success">✅ updateOrderStatus function exists</div>';
            } else {
                html += '<div class="error">❌ updateOrderStatus function NOT found</div>';
            }
            
            if (typeof assignDriver === 'function') {
                html += '<div class="success">✅ assignDriver function exists</div>';
            } else {
                html += '<div class="error">❌ assignDriver function NOT found</div>';
            }
            
            if (typeof refreshOrders === 'function') {
                html += '<div class="success">✅ refreshOrders function exists</div>';
            } else {
                html += '<div class="error">❌ refreshOrders function NOT found</div>';
            }
            
            if (typeof exportOrders === 'function') {
                html += '<div class="success">✅ exportOrders function exists</div>';
            } else {
                html += '<div class="error">❌ exportOrders function NOT found</div>';
            }
            
            if (typeof showNotification === 'function') {
                html += '<div class="success">✅ showNotification function exists</div>';
            } else {
                html += '<div class="error">❌ showNotification function NOT found</div>';
            }
            
            html += '</pre>';
            results.innerHTML = html;
        }
        
        async function testUpdateStatus() {
            const orderId = document.getElementById('testOrderId').value;
            const results = document.getElementById('api-results');
            results.innerHTML = '<pre>Testing status update for order ' + orderId + '...</pre>';
            
            try {
                const response = await fetch(`/api/admin/orders/${orderId}`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({status: 'confirmed'})
                });
                
                const text = await response.text();
                results.innerHTML = '<pre>' +
                    'Status: ' + response.status + '\n' +
                    'Response: ' + text + '\n' +
                    '</pre>';
            } catch (error) {
                results.innerHTML = '<pre class="error">Error: ' + error.message + '</pre>';
            }
        }
        
        async function testAssignDriver() {
            const orderId = document.getElementById('testOrderId').value;
            const results = document.getElementById('api-results');
            results.innerHTML = '<pre>Testing driver assignment for order ' + orderId + '...</pre>';
            
            try {
                const response = await fetch(`/api/admin/orders/${orderId}`, {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'same-origin',
                    body: JSON.stringify({assigned_driver: 'Test Driver'})
                });
                
                const text = await response.text();
                results.innerHTML = '<pre>' +
                    'Status: ' + response.status + '\n' +
                    'Response: ' + text + '\n' +
                    '</pre>';
            } catch (error) {
                results.innerHTML = '<pre class="error">Error: ' + error.message + '</pre>';
            }
        }
        
        async function testExport() {
            const results = document.getElementById('export-results');
            results.innerHTML = '<pre>Testing export...</pre>';
            
            try {
                const response = await fetch('/api/admin/orders/export', {
                    method: 'GET',
                    credentials: 'same-origin'
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    results.innerHTML = '<pre class="success">✅ Export successful! Size: ' + blob.size + ' bytes</pre>';
                } else {
                    const text = await response.text();
                    results.innerHTML = '<pre class="error">❌ Export failed: ' + response.status + '\n' + text + '</pre>';
                }
            } catch (error) {
                results.innerHTML = '<pre class="error">Error: ' + error.message + '</pre>';
            }
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            setTimeout(testFunctions, 500);
        });
    </script>
</body>
</html>
